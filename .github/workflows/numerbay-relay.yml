name: NumerBay Relay

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 2-6"

jobs:
  relay:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install numerapi numerbay

      - name: Wait until 12:51 UTC, download submission, upload to NumerBay
        env:
          NUMERAI_PUBLIC_ID: ${{ secrets.NUMERAI_PUBLIC_ID }}
          NUMERAI_SECRET_KEY: ${{ secrets.NUMERAI_SECRET_KEY }}

          NUMERBAY_USERNAME: ${{ secrets.NUMERBAY_USERNAME }}
          NUMERBAY_PASSWORD: ${{ secrets.NUMERBAY_PASSWORD }}

          MODEL1: "0a07d661-ba3d-4236-9746-f01fb6bd4fd5"
          PRODUCT1: "crypto-predictions-utopic_peak"
          MODEL2: "c059800f-7d34-4898-81ca-bd6d3f257974"
          PRODUCT2: "crypto-predictions-utopic_residual"
        run: |
          python << 'EOF'
          import os
          import time
          import traceback
          from datetime import datetime, timezone

          from numerapi import CryptoAPI

          # Wait until 12:51 UTC
          now = datetime.now(timezone.utc)
          target = now.replace(hour=12, minute=51, second=0, microsecond=0)

          if now < target:
              wait_seconds = (target - now).total_seconds()
              print(f"Sleeping for {wait_seconds:.0f} seconds...")
              time.sleep(wait_seconds)

          print("Reached relay time.")

          api = CryptoAPI(
              public_id=os.environ["NUMERAI_PUBLIC_ID"],
              secret_key=os.environ["NUMERAI_SECRET_KEY"],
          )

          # Preserve original filename assigned by NumerAPI
          file1 = api.download_submission(
              MODEL1=os.environ["MODEL1"]
          )
          print(f"Downloaded file: {file1}")

          
          file2 = api.download_submission(
              MODEL1=os.environ["MODEL2"]
          )
          print(f"Downloaded file: {file2}")

          # NumerBay upload
          from numerbay import NumerBay

          nb = NumerBay(
              username=os.environ["NUMERBAY_USERNAME"],
              password=os.environ["NUMERBAY_PASSWORD"]
          )

          print("Uploading to NumerBay...")

          try:
              nb.upload_artifact(
                  file_path=file1,
                  product_full_name=os.environ["PRODUCT1"]
              )
          except Exception as exc:
              print(f"NumerBay upload failed: {type(exc).__name__}: {exc}")

              response = getattr(exc, "response", None)
              if response is not None:
                  print(f"HTTP status: {getattr(response, 'status_code', 'unknown')}")
                  print(f"HTTP headers: {getattr(response, 'headers', {})}")
                  body = getattr(response, "text", "")
                  print("HTTP body:")
                  print(body[:4000] if body else "<empty response body>")

                  try:
                      json_payload = response.json()
                      print("JSON payload:")
                      print(json_payload)
                  except Exception as json_exc:
                      print(f"Could not parse response as JSON: {type(json_exc).__name__}: {json_exc}")

              traceback.print_exc()
              raise

          try:
              nb.upload_artifact(
                  file_path=file2,
                  product_full_name=os.environ["PRODUCT2"]
              )
          except Exception as exc:
              print(f"NumerBay upload failed: {type(exc).__name__}: {exc}")

              response = getattr(exc, "response", None)
              if response is not None:
                  print(f"HTTP status: {getattr(response, 'status_code', 'unknown')}")
                  print(f"HTTP headers: {getattr(response, 'headers', {})}")
                  body = getattr(response, "text", "")
                  print("HTTP body:")
                  print(body[:4000] if body else "<empty response body>")

                  try:
                      json_payload = response.json()
                      print("JSON payload:")
                      print(json_payload)
                  except Exception as json_exc:
                      print(f"Could not parse response as JSON: {type(json_exc).__name__}: {json_exc}")

              traceback.print_exc()
              raise

          print("Upload complete.")
          EOF
